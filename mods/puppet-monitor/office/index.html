<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppet Office</title>
<style>
  :root { --bg: #14121c; --ink: #e8e4f0; --dim: #8a83a0; --alert: #ff5a5a; --ok: #6bf0a0; --lead: #ffb000; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 ui-monospace, Consolas, monospace; }
  header { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px; }
  header b { color: var(--lead); }
  header span { color: var(--dim); }
  #stage { position: relative; margin: 0 16px 16px; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
  .tag, .bubble { position: absolute; transform: translate(-50%, 0); pointer-events: none; white-space: nowrap; }
  .tag { text-align: center; text-shadow: 0 1px 0 #000; }
  .tag .name { font-weight: bold; }
  .tag .alert { color: var(--alert); }
  .tag .dim { color: var(--dim); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
  .bubble { transform: translate(-50%, -100%); background: #fff; color: #1a1726; padding: 4px 8px; border-radius: 6px;
            white-space: normal; width: max-content; max-width: 30ch; box-shadow: 0 2px 0 #000; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .empty { color: var(--dim); padding: 40px 16px; }
</style>
</head>
<body>
<header><b>Puppet Office</b><span id="info">waiting for the session...</span></header>
<div id="stage"><canvas id="c"></canvas></div>
<script>
// The mod rewrites state.js every second; reloading it as a script works from file://, with no server.
let state = null
window.office = s => { state = s }
function poll() {
  const old = document.getElementById('state')
  if (old) old.remove()
  const tag = document.createElement('script')
  tag.id = 'state'
  tag.src = `state.js?${Date.now()}`
  document.body.appendChild(tag)
}
setInterval(poll, 1000)
poll()

const T = 16 // one tile, in art pixels
const ROOM_W = 9, ROOM_H = 7, HALL = 3, LEAD_W = 13, LEAD_H = 7
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
const stage = document.getElementById('stage')

// Every agent is a little orange critter; a hash of its name picks its shade.
const SHADES = ['#d97757', '#e08a5f', '#c9654a', '#e39b6d', '#cf6f4f', '#da7f62']
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7)
const shadeOf = name => SHADES[hash(name) % SHADES.length]

const px = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h) }

// The critter: 14 by 10 cells of U pixels, x its left edge, y its feet.
const U = 2, CW = 14 * U, CH = 10 * U
function critter(x, y, color, pose, frame, facing, crown) {
  const c = (col, row, w, h, fill) => px(x + col * U, y - CH + row * U, w * U, h * U, fill)
  const top = (pose === 'talk' || pose === 'sit') && frame % 2 ? -1 : 0
  // Legs: the two pairs take turns while walking.
  const lift = pose === 'walk' ? (frame % 2 ? [1, 0] : [0, 1]) : [0, 0]
  for (const [col, pair] of [[3, 0], [5, 1], [8, 0], [10, 1]]) c(col, 6 + top, 1, 3 - lift[pair], color)
  c(2, top, 10, 6, color) // body
  c(2, 5 + top, 10, 1, '#00000030')
  // Arms: tapping keys while it works.
  const tap = pose === 'sit' && frame % 2 ? 1 : 0
  c(0, 2 + top + tap, 2, 2, color)
  c(12, 2 + top - tap, 2, 2, color)
  if (facing !== 'up') {
    const shift = facing === 'left' ? -1 : facing === 'right' ? 1 : 0
    c(4 + shift, 1 + top, 1, 2, '#1a1726')
    c(9 + shift, 1 + top, 1, 2, '#1a1726')
  }
  if (crown) { c(4, top - 1, 6, 1, '#ffb000'); c(4, top - 2, 1, 1, '#ffb000'); c(7, top - 2, 1, 1, '#ffb000'); c(9, top - 2, 1, 1, '#ffb000') }
}

function room(x, y, w, h, wall, floorA, floorB, door = true) {
  for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) px(x + i * T, y + j * T, T, T, (i + j) % 2 ? floorA : floorB)
  px(x, y, w * T, 2 * T, wall) // back wall
  px(x, y + 2 * T - 3, w * T, 3, '#00000055')
  px(x, y, 3, h * T, wall)
  px(x + w * T - 3, y, 3, h * T, wall)
  const gap = x + Math.floor(w / 2) * T - T / 2
  if (!door) px(x, y + h * T - 3, w * T, 3, wall)
  else {
    px(x, y + h * T - 3, gap - x, 3, wall) // front wall with a door
    px(gap + 2 * T, y + h * T - 3, x + w * T - gap - 2 * T, 3, wall)
  }
}

// A desk with its screen on the left, facing us; its critter sits behind it, on the right.
function desk(d, screen, frame) {
  const { x, y, w } = d
  px(x, y, w, 10, '#8a5a34')
  px(x, y + 10, w, 3, '#5e3c22')
  const mx = x + 4
  px(mx, y - 12, 18, 11, '#2b2838')
  px(mx + 8, y - 1, 2, 2, '#2b2838')
  if (screen === 'off') px(mx + 1, y - 11, 16, 9, '#111')
  else if (screen === 'done') {
    px(mx + 1, y - 11, 16, 9, '#123a28')
    px(mx + 5, y - 6, 2, 2, '#6bf0a0'); px(mx + 7, y - 4, 2, 2, '#6bf0a0'); px(mx + 9, y - 8, 2, 4, '#6bf0a0')
  } else {
    px(mx + 1, y - 11, 16, 9, screen === 'alert' ? '#3a1218' : '#14243a')
    // Code scrolls while the agent works.
    const colors = ['#6bf0a0', '#ffb000', '#7ab8ff', '#e8e4f0']
    for (let line = 0; line < 4; line++) {
      const seed = hash(String(line + frame))
      px(mx + 2 + (seed % 3), y - 10 + line * 2, 3 + (seed % 9), 1, screen === 'alert' ? '#ff5a5a' : colors[seed % 4])
    }
  }
}

function plant(x, y) { px(x + 3, y + 8, 6, 6, '#8a5a34'); px(x + 1, y + 1, 10, 8, '#3e8e4a'); px(x + 4, y - 2, 4, 4, '#4fae5c') }

// Who is where, in art pixels, kept between frames so walks are smooth.
const walkers = {}
const seen = {}
let first = true

function layout(n, width) {
  const perRow = Math.max(1, Math.min(n, Math.floor(width / (ROOM_W * T))))
  const rows = Math.ceil(n / perRow)
  const worldW = Math.max(perRow * ROOM_W, LEAD_W) * T
  const rooms = []
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / perRow), c = i % perRow
    const inRow = Math.min(perRow, n - r * perRow)
    const x0 = (worldW - inRow * ROOM_W * T) / 2
    rooms.push({ x: x0 + c * ROOM_W * T, y: r * (ROOM_H + 1) * T })
  }
  const hallY = rows * (ROOM_H + 1) * T - T
  const lead = { x: (worldW - LEAD_W * T) / 2, y: hallY + HALL * T }
  return { rooms, hallY, lead, worldW, worldH: lead.y + LEAD_H * T + 4 }
}

const deskOf = (r, w) => ({ x: r.x + Math.floor((w * T - 60) / 2), y: r.y + 3 * T, w: 60 })
const seatOf = (r, w = ROOM_W) => ({ x: deskOf(r, w).x + 28, y: r.y + 3 * T + 6 })
const doorOf = r => ({ x: r.x + Math.floor(ROOM_W / 2) * T + T / 2 - CW / 2, y: r.y + ROOM_H * T + 4 })
const hallOf = L => L.hallY + T + 14

// Out from behind the desk, down, and through the door into the hall.
function leave(L, r) {
  const seat = seatOf(r), side = deskOf(r, ROOM_W).x + 64
  return [seat, { x: side, y: seat.y }, { x: side, y: r.y + 5 * T }, doorOf(r), { x: doorOf(r).x, y: hallOf(L) }]
}

function routeToLead(L, r, i) {
  const d = deskOf(L.lead, LEAD_W)
  // Beside the lead's desk, to its left, so the two bubbles do not cover each other.
  const spot = { x: d.x - CW - 6 - (i % 3) * 12, y: d.y + 12 }
  const door = { x: L.lead.x + Math.floor(LEAD_W / 2) * T + T / 2 - CW / 2, y: L.lead.y + 6 }
  return [...leave(L, r), { x: door.x, y: hallOf(L) }, door, { x: spot.x, y: L.lead.y + 2 * T + 10 }, spot]
}

function routeToRoom(L, from, to) {
  const d = deskOf(to, ROOM_W)
  return [...leave(L, from), { x: doorOf(to).x, y: hallOf(L) }, doorOf(to), { x: doorOf(to).x, y: to.y + 5 * T }, { x: d.x + 2, y: d.y + 30 }]
}

let last = performance.now()
function frame(now) {
  const dt = Math.min(0.5, (now - last) / 1000)
  last = now
  requestAnimationFrame(frame)
  if (!state) return
  for (const el of stage.querySelectorAll('.tag, .bubble')) el.remove()

  const agents = state.agents
  const L = layout(agents.length, Math.max(stage.clientWidth / 3, LEAD_W * T))
  if (canvas.width !== L.worldW || canvas.height !== L.worldH) { canvas.width = L.worldW; canvas.height = L.worldH }
  // Fit the whole floor in the window, wide or tall.
  canvas.style.width = `${Math.min(stage.clientWidth, ((innerHeight - 60) * L.worldW) / L.worldH)}px`
  const scale = canvas.clientWidth / L.worldW
  ctx.fillStyle = '#14121c'
  ctx.fillRect(0, 0, L.worldW, L.worldH)
  const tick = Math.floor(now / 250)

  // The hall, then the rooms. Desks are drawn with the critters, so whoever stands in front covers them.
  px(0, L.hallY, L.worldW, HALL * T + T, '#3a3550')
  for (let i = 0; i < L.worldW; i += T) px(i, L.hallY + T * 2, T / 2, 2, '#4a4466')
  const things = []
  agents.forEach((a, i) => {
    const r = L.rooms[i]
    room(r.x, r.y, ROOM_W, ROOM_H, a.alert ? '#6a2a34' : '#5a4f7a', '#c9a77a', '#bf9c6e')
    plant(r.x + 6, r.y + 2 * T + 2)
    const d = deskOf(r, ROOM_W)
    const screen = a.alert ? 'alert' : a.working ? 'on' : a.status === 'completed' ? 'done' : 'off'
    things.push({ y: d.y + 13, draw: () => desk(d, screen, tick) })
  })
  room(L.lead.x, L.lead.y, LEAD_W, LEAD_H, '#7a5a2a', '#a8b0c8', '#9aa2bb', false)
  plant(L.lead.x + 6, L.lead.y + 2 * T + 2)
  plant(L.lead.x + LEAD_W * T - 18, L.lead.y + 2 * T + 2)
  const leadDesk = deskOf(L.lead, LEAD_W)
  things.push({ y: leadDesk.y + 13, draw: () => desk(leadDesk, state.lead.alert ? 'alert' : state.lead.busy ? 'on' : 'off', tick) })
  // The lead's door faces the hall: open the hall wall there.
  px(L.lead.x + Math.floor(LEAD_W / 2) * T - T / 2, L.lead.y, 2 * T, 3, '#3a3550')

  // Agents: sit, or walk to whoever they report to and back the same way.
  agents.forEach((a, i) => {
    const r = L.rooms[i]
    const w = walkers[a.id] ??= { ...seatOf(r), path: [], mode: 'sit', facing: 'down', talk: 0, text: '' }
    if (a.report && seen[a.id] !== a.report.at) {
      seen[a.id] = a.report.at
      if (!first && w.mode === 'sit') {
        const target = agents.findIndex(b => b.name === a.report.to || b.id === a.report.to)
        w.text = a.report.text
        w.route = target >= 0 && target !== i ? routeToRoom(L, r, L.rooms[target]) : routeToLead(L, r, i)
        w.path = w.route.slice(1)
        w.back = true
      }
    }
    if (w.path.length) {
      const p = w.path[0]
      const dx = p.x - w.x, dy = p.y - w.y, d = Math.hypot(dx, dy), step = 90 * dt
      w.facing = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'
      if (d <= step) { w.x = p.x; w.y = p.y; w.path.shift() } else { w.x += (dx / d) * step; w.y += (dy / d) * step }
      w.mode = 'walk'
      if (!w.path.length) {
        if (w.back) { w.mode = 'talk'; w.talk = 6; w.facing = 'right' }
        else { w.mode = 'sit'; w.facing = 'down' }
      }
    } else if (w.mode === 'talk') {
      w.talk -= dt
      if (w.talk <= 0) { w.back = false; w.path = w.route.slice(0, -1).reverse() }
    }
  })
  first = false

  const leadSeat = seatOf(L.lead, LEAD_W)
  const critters = [
    ...agents.map(a => ({ ...walkers[a.id], color: shadeOf(a.name), a })),
    { ...leadSeat, mode: 'sit', facing: 'down', color: '#d97757', lead: true },
  ]
  for (const p of critters) things.push({ y: p.y, draw: () => {
    const typing = p.lead ? state.lead.busy : p.a.working && !p.a.alert
    const moving = p.mode === 'walk' || p.mode === 'talk' || typing
    critter(p.x, p.y, p.color, p.mode, moving ? tick : 0, p.facing, p.lead)
    const alert = p.lead ? state.lead.alert : p.a.alert
    if (alert && tick % 2) { px(p.x + CW / 2 - 1, p.y - CH - 14, 3, 7, '#ff5a5a'); px(p.x + CW / 2 - 1, p.y - CH - 5, 3, 3, '#ff5a5a') }
    if (p.mode === 'talk') bubble(p.x + CW / 2, p.y - CH - 4, p.text, scale)
  } })
  things.sort((p, q) => p.y - q.y).forEach(t => t.draw())

  // Name plates on each back wall, and the lead's words.
  agents.forEach((a, i) => {
    const r = L.rooms[i]
    const line = a.alert ? `<div class="alert">! ${esc(a.alert.text)}</div>` : `<div class="dim">${esc(a.status)}</div>`
    tag(r.x + (ROOM_W * T) / 2, r.y + 2, `<div class="name">${esc(a.name)}</div>${line}<div class="dim">${esc(a.task ?? a.doing)}</div>`, scale)
  })
  tag(L.lead.x + (LEAD_W * T) / 2, L.lead.y + 6, `<div class="name" style="color:var(--lead)">coordinator</div><div class="dim">${esc(state.lead.doing || (state.lead.busy ? 'working' : 'idle'))}</div>`, scale)
  const listening = critters.some(p => p.mode === 'talk' && p.y > L.lead.y)
  if (state.lead.busy && state.lead.said && !listening) bubble(leadSeat.x + CW / 2, leadSeat.y - CH - 8, state.lead.said, scale)

  const working = agents.filter(a => a.working).length
  document.getElementById('info').textContent =
    `${agents.length} agents, ${working} working · tasks ${state.tasks.done}/${state.tasks.total} done`
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
function tag(x, y, html, scale) {
  const el = document.createElement('div')
  el.className = 'tag'
  el.style.left = `${canvas.offsetLeft + x * scale}px`
  el.style.top = `${y * scale}px`
  el.innerHTML = html
  stage.appendChild(el)
}
function bubble(x, y, text, scale) {
  const el = document.createElement('div')
  el.className = 'bubble'
  el.style.left = `${canvas.offsetLeft + x * scale}px`
  el.style.top = `${y * scale}px`
  el.textContent = text.length > 140 ? `${text.slice(0, 139)}…` : text
  stage.appendChild(el)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
