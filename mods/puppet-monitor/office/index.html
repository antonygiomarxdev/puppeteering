<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppet Office</title>
<style>
  :root { --bg: #eceaf4; --ink: #2b2838; --dim: #7a7590; --alert: #d63a4a; --ok: #2fa56a; --lead: #d98a00; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 ui-monospace, Consolas, monospace; }
  header { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px; }
  header b { color: var(--lead); }
  header span { color: var(--dim); }
  main { display: flex; gap: 16px; margin: 0 16px 16px; align-items: flex-start; }
  #stage { position: relative; flex: 1; min-width: 0; }
  #queue { width: 260px; flex: none; background: #fff; border: 2px solid #cfc9e6; border-radius: 10px; padding: 10px; box-shadow: 0 3px 0 #cfc9e6; }
  #queue h2 { margin: 0 0 6px; font-size: 13px; color: var(--lead); }
  #queue h3 { margin: 10px 0 4px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .card { background: #fff4b8; color: var(--ink); padding: 4px 6px; margin-bottom: 4px; border-radius: 4px; box-shadow: 0 2px 0 #e6d98a; }
  .card.done { opacity: .55; text-decoration: line-through; }
  .card .who { display: inline-block; margin-top: 2px; padding: 0 6px; border-radius: 8px; color: #fff; font-size: 11px; font-weight: bold; }
  .card .free { color: var(--dim); font-size: 11px; }
  .card .blocked { color: var(--alert); font-size: 11px; }
  @media (max-width: 700px) { main { flex-direction: column; } #queue { width: auto; align-self: stretch; } }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; border-radius: 6px; box-shadow: 0 3px 0 #cfc9e6; }
  .tag, .bubble { position: absolute; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap; text-align: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: #2b2838; color: #fff; padding: 2px 9px; border-radius: 999px; font-weight: bold; font-size: 12px; box-shadow: 0 2px 0 #00000030; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .sub { display: block; margin: 2px auto 0; width: fit-content; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--ink); background: #ffffffe0; padding: 0 6px; border-radius: 6px; }
  .sub.alert { color: var(--alert); font-weight: bold; }
  .bubble { background: #fff; color: var(--ink); padding: 4px 10px; border-radius: 12px; white-space: normal; width: max-content; max-width: 30ch; box-shadow: 0 2px 0 #00000030; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .empty { color: var(--dim); padding: 40px 16px; }
</style>
</head>
<body>
<header><b id="title">Puppet Office</b><span id="where"></span><span id="info">waiting for the session...</span></header>
<main><div id="stage"><canvas id="c"></canvas></div><aside id="queue"></aside></main>
<script>
// The mod rewrites this session's state file every second; reloading it as a script works from file://, with no server.
// ?s=<key> names the session's file; without a key it reads the plain state.js.
let state = null
window.office = s => { state = s; names(); queue() }
// The project this state is of: named in the header and the tab, its directory dimmed beside it.
function names() {
  if (!state.project) return
  document.getElementById('title').textContent = `Puppet Office · ${state.project.name}`
  document.getElementById('where').textContent = state.project.cwd
  document.title = `${state.project.name} · Puppet Office`
}
const key = new URLSearchParams(location.search).get('s')
const file = key ? `state-${key.replace(/[^A-Za-z0-9-]/g, '')}.js` : 'state.js'
// If this line never shows, no script ran in the browser; if it stays, the state file did not load (the error says where).
const info = document.getElementById('info')
info.textContent = `script running, loading ${file}...`
let failures = 0
function poll() {
  const old = document.getElementById('state')
  if (old) old.remove()
  const tag = document.createElement('script')
  tag.id = 'state'
  tag.src = `${file}?${Date.now()}`
  tag.onerror = () => { failures++; info.textContent = `cannot load ${file} from ${location.href} (failed ${failures} times)` }
  document.body.appendChild(tag)
}
setInterval(poll, 1000)
poll()

const canvas = document.getElementById('c')
let ctx = canvas.getContext('2d') // swapped for the offscreen scene while it paints
const main = ctx
const cache = { key: '', c: document.createElement('canvas') }
const stage = document.getElementById('stage')

// Every agent is a little orange critter; a hash of its name picks its shade.
const SHADES = ['#d97757', '#e08a5f', '#c9654a', '#e39b6d', '#cf6f4f', '#da7f62']
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7)
const shadeOf = name => SHADES[hash(name) % SHADES.length]

const px = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h) }
const disc = (cx, cy, r, color) => { for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); px(cx - w, cy + dy, 2 * w + 1, 1, color) } }
const shadow = (x, y, w, h) => px(x, y, w, h, '#0000001c')

// The critter: 14 by 10 cells of U pixels, x its left edge, y its feet. Three-quarter view (typing, walking sideways)
// or front view (idle, talking, asleep). The grey stick is a pen: it taps while typing and swings while it talks.
// Proportions follow the owner's recording: a blocky body (10 wide, 7 tall), square 2x2 eyes, four chunky legs.
const U = 2, CW = 14 * U, CH = 10 * U
const INK = '#1a1726', STICK = '#8a8a98'
// Three-quarter view facing left: l the lit front, d the shaded side, k an eye. A snout steps out below the eyes.
const SIDE = [4, 4, 4, 4, 2, 2, 2].map((pad, row) => {
  const cells = ('.'.repeat(pad) + 'l'.repeat(12 - pad) + 'dd').split('')
  if (row === 2 || row === 3) for (const col of [5, 6, 8, 9]) cells[col] = 'k'
  return cells.join('')
})
const LEGS_FRONT = [4, 10, 15, 21], LEGS_SIDE = [8, 14, 19, 25] // px offsets, 3px wide, evenly spaced under the body
const GESTURE = [0, 0, 1, 2, 2, 2, 1, 0] // stick: 0 down-left, 1 level, 2 up
function critter(x, y, color, pose, tick, facing, crown, asleep, typing, seed) {
  const side = !asleep && (typing || (pose === 'walk' && (facing === 'left' || facing === 'right')))
  const mirror = side && facing === 'right'
  const bob = !asleep && (typing || pose === 'talk') && tick % 2 ? 1 : 0 // the body bobs 1px; the legs stay
  const r = (px0, py, w, h, fill) => px(x + (mirror ? CW - px0 - w : px0), y - CH + py, w, h, fill)
  const c = (col, row, w, h, fill, up = 0) => r(col * U, row * U - up, w * U, h * U, fill)
  // Legs: the two pairs take turns while walking; in side view the far pair is darker.
  const lift = pose === 'walk' ? (tick % 2 ? [2, 0] : [0, 2]) : [0, 0]
  ;(side ? LEGS_SIDE : LEGS_FRONT).forEach((lx, k) => {
    r(lx, 14, 3, 6 - lift[k % 2], color)
    if (side) r(lx, 14, 3, 6 - lift[k % 2], k % 2 ? '#00000038' : '#ffffff22')
  })
  if (side) {
    SIDE.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch === '.') return
      c(i, j, 1, 1, ch === 'k' ? INK : color, bob)
      if (ch === 'l') c(i, j, 1, 1, '#ffffff22', bob)
      if (ch === 'd') c(i, j, 1, 1, '#00000038', bob)
    }))
    c(2, 6, 12, 1, '#00000020', bob)
    if (typing) { // the pen leaves the front low, near the near legs, and taps down toward the desk
      const n = 6 + (tick % 2)
      for (let i = 0; i < n; i++) r(3 - i, 12 + i, 1, 1, STICK)
      r(1 - n, 12 + n, 3, 1, STICK)
    }
  } else {
    c(2, 0, 10, 7, color, bob)
    c(2, 0, 10, 1, '#ffffff22', bob)
    c(2, 6, 10, 1, '#00000030', bob)
    c(0, 3, 2, 2, color, bob) // arms: short nubs at mid height
    c(12, 3, 2, 2, color, bob)
    if (asleep) { c(4, 3, 2, 1, INK); c(8, 3, 2, 1, INK) } // closed: a flat line each
    else if (facing !== 'up' || pose !== 'walk') {
      c(4, 2, 2, 2, INK, bob)
      // A wink every few seconds, at an offset per agent so they do not blink together.
      if (pose === 'sit' && (tick + seed) % 14 === 0) c(8, 3, 2, 1, INK, bob)
      else c(8, 2, 2, 2, INK, bob)
    }
    if (pose === 'talk') {
      const g = GESTURE[tick % 8]
      if (g === 0) for (let i = 0; i < 5; i++) r(1 - i, 8 + i, 1, 1, STICK)
      else if (g === 1) r(-6, 7, 8, 1, STICK)
      else r(0, -5, 1, 11, STICK)
    }
  }
  if (crown) { const o = side ? 2 : 0; c(4 + o, -1, 6, 1, '#ffb000', bob); for (const k of [4, 7, 9]) c(k + o, -2, 1, 1, '#ffb000', bob) }
}

// A white desk with its screen on the left; its critter sits below it, facing us.
const DESK_W = 40
function desk(d, screen, frame, seed) {
  const { x, y, w } = d
  shadow(x + 1, y + 12, w, 3)
  px(x, y, w, 10, '#f6f6fb'); px(x, y, w, 1, '#ffffff')
  px(x, y + 10, w, 3, '#b8bace')
  const mx = x + 4
  px(mx, y - 12, 18, 11, '#2b2838')
  px(mx + 8, y - 1, 2, 2, '#2b2838')
  if (screen === 'off') px(mx + 1, y - 11, 16, 9, '#171521')
  else if (screen === 'done') {
    px(mx + 1, y - 11, 16, 9, '#123a28')
    px(mx + 5, y - 6, 2, 2, '#6bf0a0'); px(mx + 7, y - 4, 2, 2, '#6bf0a0'); px(mx + 9, y - 8, 2, 4, '#6bf0a0')
  } else {
    px(mx + 1, y - 11, 16, 9, screen === 'alert' ? '#3a1218' : '#14243a')
    // Code scrolls while the agent works.
    const colors = ['#6bf0a0', '#ffb000', '#7ab8ff', '#e8e4f0']
    for (let line = 0; line < 4; line++) {
      const s = hash(String(line + frame))
      px(mx + 2 + (s % 3), y - 10 + line * 2, 3 + (s % 9), 1, screen === 'alert' ? '#ff5a5a' : colors[s % 4])
    }
  }
  px(x + 24, y + 3, 11, 3, '#d3d6e6') // keyboard
  const v = hash(seed)
  if (v % 3 === 0) { px(x + w - 6, y + 2, 4, 5, ['#e8715a', '#4a90d9', '#f2c14e'][(v >> 3) % 3]); px(x + w - 2, y + 3, 1, 2, '#e8e4f0') } // a mug
  else if (v % 3 === 1) { px(x + 2, y + 5, 4, 4, '#ffffff'); px(x + 1, y + 1, 6, 5, '#4fae5c') } // a little plant
  else { px(x + w - 7, y + 1, 5, 7, '#6a6f86'); px(x + w - 6, y + 3, 3, 3, '#3a3f56') } // a speaker
}

// The place: an open plan on a cream wood floor. Everything below is static, painted once per layout into an
// offscreen canvas, then blitted each frame.
const IW = 320, GR = 32, TOPH = 28, ZH = 124 // inner width, grass margin, top wall, height of the bottom zones
const SLOT_W = 44, ROW_H = 58, POD_GAP = 20
const WALL = '#c8c6dc', WALL_TOP = '#e6e4f1', WALL_LOW = '#a9a7c0'
const BOOKS = ['#d9534f', '#4a90d9', '#e8c04a', '#5cb85c', '#9b6bd1', '#e8e4f0']
const SKY = { day: ['#7ec8ff', '#bfe6ff'], dawn: ['#f0a878', '#ffd9a8'], dusk: ['#e0745a', '#f6b07a'], night: ['#1f2760', '#2f3a86'] }
const phaseOf = () => { const h = new Date().getHours(); return h >= 7 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'dusk' : h >= 5 && h < 7 ? 'dawn' : 'night' }

function floorPlanks(x, y, w, h) {
  px(x, y, w, h, '#f3e6d6')
  for (let j = 0; j < h / 8; j++) {
    px(x, y + j * 8 + 7, w, 1, '#e9d8c3')
    const off = (j * 29) % 48
    for (let i = -off; i < w; i += 48) if (i >= 0) px(x + i, y + j * 8, 1, 7, '#ecdcc9')
  }
}
function tileFloor(x, y, w, h) {
  for (let i = 0; i < w / T; i++) for (let j = 0; j < h / T; j++) {
    const left = Math.min(T, w - i * T), top = Math.min(T, h - j * T)
    px(x + i * T, y + j * T, left, top, (i + j) % 2 ? '#b6bac6' : '#abafbd')
    px(x + i * T, y + j * T, left, 1, '#ffffff30'); px(x + i * T, y + j * T, 1, top, '#ffffff1c')
  }
  px(x, y, w, 1, '#8f94a8'); px(x, y + h - 1, w, 1, '#8f94a8'); px(x, y, 1, h, '#8f94a8'); px(x + w - 1, y, 1, h, '#8f94a8')
}
function carpetStripes(x, y, w, h) {
  px(x, y, w, h, '#a3a7ea')
  for (let i = 0; i < w; i += 8) px(x + i, y, 4, h, '#9498e0')
  px(x, y, w, 2, '#ffffff30'); px(x, y + h - 2, w, 2, '#00000018')
}
function carpetLilac(x, y, w, h) {
  px(x, y, w, h, '#f1eef9')
  for (let i = -h; i < w; i += 16) for (let k = 0; k < h; k++) { const a = i + k, b = i + h - k; if (a >= 0 && a < w) px(x + a, y + k, 1, 1, '#e0daf2'); if (b >= 0 && b < w) px(x + b, y + k, 1, 1, '#e0daf2') }
  px(x, y, w, 1, '#d6cfee'); px(x, y + h - 1, w, 1, '#d6cfee'); px(x, y, 1, h, '#d6cfee'); px(x + w - 1, y, 1, h, '#d6cfee')
}
const T = 16
function windowAt(x, y, w, h, phase) {
  const [hi, lo] = SKY[phase]
  px(x - 2, y - 2, w + 4, h + 4, '#eef0fa')
  px(x, y, w, h, hi); px(x, y + h / 2, w, h / 2, lo)
  if (phase === 'night') for (const [sx, sy] of [[5, 3], [w - 9, 6], [w / 2, 2], [10, h - 5], [w - 20, h - 4]]) px(x + sx, y + sy, 1, 1, '#ffffff')
  else px(x + 4, y + 3, 9, 2, '#ffffffcc')
  for (let m = 1; m < 4; m++) px(x + Math.floor((w * m) / 4) - 1, y, 2, h, '#eef0fa')
  px(x, y + h / 2 - 1, w, 2, '#eef0fa')
  px(x - 3, y + h + 2, w + 6, 2, '#a9a7c0')
}
function tree(x, y, pine) {
  shadow(x + 2, y + 23, 22, 4)
  px(x + 10, y + 16, 4, 8, '#8a5a34')
  if (pine) for (let k = 0; k < 5; k++) { const w = 6 + k * 4; px(x + 12 - w / 2, y + 2 + k * 4, w, 5, k % 2 ? '#3f9a55' : '#4aaa60') }
  else { disc(x + 12, y + 10, 11, '#4aa860'); disc(x + 9, y + 7, 8, '#6cc47c'); disc(x + 7, y + 5, 4, '#8fdc9a') }
}
function plantPot(x, y, kind = 0) {
  shadow(x + 1, y + 13, 11, 3)
  px(x + 3, y + 8, 7, 6, '#f6f6fb'); px(x + 3, y + 8, 7, 1, '#d6d8e6'); px(x + 8, y + 9, 2, 5, '#d6d8e6')
  if (kind === 0) { px(x + 1, y + 1, 11, 8, '#3e8e4a'); px(x + 4, y - 3, 5, 5, '#5cbf6a') }
  else if (kind === 1) { px(x + 6, y - 5, 2, 13, '#2f7a3a'); px(x, y, 14, 3, '#3e8e4a'); px(x + 2, y - 4, 10, 3, '#5cbf6a') }
  else { px(x + 1, y + 2, 11, 7, '#3e8e4a'); for (const [fx, fy] of [[2, 0], [6, -2], [9, 1]]) { px(x + fx, y + fy, 3, 3, '#f06a9a'); px(x + fx + 1, y + fy + 1, 1, 1, '#ffd84a') } }
}
function bookshelf(x, y, seed) {
  shadow(x + 1, y + 33, 22, 3)
  px(x, y, 22, 34, '#8f9bb3'); px(x + 2, y + 2, 18, 30, '#d3d9e6')
  for (let s = 0; s < 3; s++) {
    const y0 = y + 3 + s * 10
    for (let bx = x + 3, k = 0; bx < x + 18; k++) { const w = 2 + (hash(seed + s + k) % 2), bh = 5 + (hash(seed + k + s * 7) % 3); px(bx, y0 + 8 - bh, w, bh, BOOKS[hash(seed + s * 5 + k) % 6]); bx += w + 1 }
    px(x + 2, y0 + 8, 18, 2, '#8f9bb3')
  }
}
function sofaPeach(x, y, w) {
  shadow(x + 1, y + 17, w, 3)
  px(x, y, w, 8, '#f0a97c'); px(x + 2, y + 1, w - 4, 2, '#f8c4a0')
  px(x, y + 6, w, 10, '#f2b48a'); px(x + 3, y + 8, w - 6, 7, '#f8c4a0')
  px(x, y + 3, 4, 13, '#e39e74'); px(x + w - 4, y + 3, 4, 13, '#e39e74')
  for (let s = 12; s < w - 8; s += 13) px(x + s, y + 8, 1, 7, '#e39e74')
}
function armchair(x, y) {
  shadow(x + 1, y + 15, 14, 3)
  px(x, y, 16, 7, '#f08a3c'); px(x, y + 5, 16, 10, '#f5a05a'); px(x + 3, y + 7, 10, 7, '#f8b878'); px(x, y + 3, 3, 12, '#d97a30'); px(x + 13, y + 3, 3, 12, '#d97a30')
}
function pingPong(x, y) {
  shadow(x + 2, y + 26, 44, 4)
  px(x, y, 46, 26, '#2f7a5a'); px(x + 1, y + 1, 44, 24, '#3f9a6a'); px(x + 22, y + 1, 2, 24, '#e8f5ee'); px(x + 2, y + 12, 42, 1, '#e8f5ee')
  px(x + 20, y - 2, 6, 30, '#ffffff30'); px(x + 3, y + 26, 3, 4, '#6a6f86'); px(x + 40, y + 26, 3, 4, '#6a6f86')
}
function tvStand(x, y) {
  shadow(x + 1, y + 21, 28, 3)
  px(x, y + 10, 30, 12, '#4a4f66'); px(x + 2, y + 12, 26, 3, '#6a6f86'); px(x + 4, y + 16, 8, 4, '#ffb000')
  px(x + 5, y, 20, 11, '#2b2838'); px(x + 6, y + 1, 18, 9, '#3a6a9a'); px(x + 8, y + 3, 8, 2, '#7ab8ff')
}
function bamboo(x, y) {
  shadow(x + 1, y + 29, 22, 3)
  px(x, y + 16, 22, 14, '#5a5f70'); px(x + 1, y + 16, 20, 2, '#7a8096')
  for (let k = 0; k < 6; k++) { px(x + 2 + k * 3, y - 2 + (k % 2) * 3, 2, 18, '#6bbf6a'); px(x + 2 + k * 3, y + 4 + (k % 3) * 3, 2, 1, '#3e8e4a') }
}
function easel(x, y) {
  shadow(x + 3, y + 33, 32, 3)
  px(x + 3, y + 22, 2, 14, '#8a5a34'); px(x + 31, y + 22, 2, 14, '#8a5a34'); px(x + 17, y + 24, 2, 11, '#8a5a34')
  px(x, y, 36, 24, '#cfd3e2'); px(x + 2, y + 2, 32, 20, '#fbfbff')
  px(x + 5, y + 5, 12, 1, '#4a90d9'); px(x + 5, y + 9, 20, 1, '#d9534f'); px(x + 5, y + 13, 9, 1, '#4a90d9')
  px(x + 21, y + 4, 6, 6, '#ffd84a'); px(x + 28, y + 12, 5, 5, '#f09ab0')
}
function meetingTable(x, y, w) {
  shadow(x + 2, y + 18, w, 4)
  px(x, y, w, 16, '#e8c28a'); px(x, y, w, 2, '#f5dba8'); px(x, y + 14, w, 2, '#c9a066')
  px(x + 6, y + 5, 10, 6, '#ffffff'); px(x + 8, y + 7, 6, 1, '#4a90d9') // papers
  disc(x + w - 14, y + 8, 3, '#4a90d9')
}
function chairSmall(x, y, c = '#4a6ec0') { shadow(x, y + 7, 12, 2); px(x, y, 12, 8, c); px(x + 1, y + 1, 10, 3, '#ffffff30') }
function chairDesk(sx, sy) { // under the critter: a dark office chair
  shadow(sx + 2, sy, 24, 3)
  px(sx + 1, sy - 17, 26, 17, '#3a3f5c'); px(sx + 3, sy - 19, 22, 2, '#3a3f5c'); px(sx + 3, sy - 17, 22, 1, '#ffffff25')
  px(sx + 9, sy, 10, 3, '#2b2f46')
}

// Layout in art pixels. Desks sit in pods of two rows on grey tile, with the rest of the floor open to walk on.
function layout(n) {
  const C = Math.max(1, Math.min(4, n)), R = Math.max(1, Math.ceil(n / C))
  const ix = GR, W = IW + 2 * GR
  const rowY = Array.from({ length: R }, (_, r) => TOPH + 32 + Math.floor(r / 2) * (2 * ROW_H + POD_GAP) + (r % 2) * ROW_H)
  const bx = Math.round(ix + 48 + (IW - 56 - C * SLOT_W + 4) / 2)
  const zy = rowY[R - 1] + 44 + 20
  const mz = { x: ix + 40, y: zy, w: 136 }, lz = { x: ix + 192, y: zy, w: 120 }
  return { C, R, ix, W, rowY, bx, zy, mz, lz, corrX: ix + 4, H: zy + ZH + 10 }
}
const deskOf = (L, i) => ({ x: L.bx + (i % L.C) * SLOT_W, y: L.rowY[Math.floor(i / L.C)], w: DESK_W })
const seatOf = (L, i) => { const d = deskOf(L, i); return { x: d.x + 6, y: d.y + 28 } }
const leadDesk = L => ({ x: L.mz.x + 48, y: L.zy + 22, w: DESK_W })
const leadSeat = L => { const d = leadDesk(L); return { x: d.x + 6, y: d.y + 28 } }
const aisleOf = (L, i) => L.rowY[Math.floor(i / L.C)] + 38

// Out from the chair, down to the aisle in front of the row, and along it.
function leave(L, i) {
  const seat = seatOf(L, i)
  return [seat, { x: seat.x, y: aisleOf(L, i) }]
}
// To the left corridor, which runs down the whole floor, then to the row of the target.
function routeToLead(L, i) {
  const spot = { x: L.mz.x + 2 + (i % 4) * 34, y: L.zy + 104 + (Math.floor(i / 4) % 2) * 10 }
  return [...leave(L, i), { x: L.corrX, y: aisleOf(L, i) }, { x: L.corrX, y: spot.y }, spot]
}
function routeToDesk(L, i, j) {
  const peer = seatOf(L, j), stand = { x: peer.x + 20, y: aisleOf(L, j) }
  if (Math.floor(i / L.C) === Math.floor(j / L.C)) return [...leave(L, i), stand]
  return [...leave(L, i), { x: L.corrX, y: aisleOf(L, i) }, { x: L.corrX, y: stand.y }, stand]
}

// The whole static scene.
function paint(L, agents, phase) {
  const { ix, W, H, C, R } = L
  ctx.fillStyle = '#d5ecd8'; ctx.fillRect(0, 0, W, H)
  for (let k = 0; k < 90; k++) px((hash('g' + k) % W), (hash('h' + k) % H), 2, 1, '#c3e2c8')
  for (let y = 12, k = 0; y < H - 30; y += 46, k++) { tree(4, y, k % 3 === 1); tree(ix + IW + 8, y + 18, k % 3 === 0) }
  floorPlanks(ix, TOPH, IW, H - TOPH - 6)
  // The edge walls: a lit top face on the back wall, thin sides, big windows.
  px(ix - 4, 0, IW + 8, TOPH, WALL); px(ix - 4, 0, IW + 8, 3, WALL_TOP); px(ix - 4, TOPH - 3, IW + 8, 3, WALL_LOW)
  px(ix - 4, TOPH, 4, H - TOPH, WALL); px(ix + IW, TOPH, 4, H - TOPH, WALL); px(ix - 4, H - 6, IW + 8, 6, WALL)
  px(ix, TOPH, IW, 4, '#00000018')
  for (let k = 0; k < 4; k++) windowAt(ix + 10 + k * 78, 5, 56, 16, phase)
  // Desk pods on grey tile: two rows each, every slot with its chair, and a desk of its own when vacant.
  for (let p = 0; p * 2 < R; p++) {
    const r0 = p * 2, r1 = Math.min(r0 + 1, R - 1)
    tileFloor(L.bx - 12, L.rowY[r0] - 18, C * SLOT_W + 20, L.rowY[r1] + 44 - (L.rowY[r0] - 18))
  }
  for (let i = 0; i < R * C; i++) {
    const d = deskOf(L, i), s = seatOf(L, i)
    chairDesk(s.x, s.y)
    if (i >= agents.length) desk(d, 'off', 0, 'empty' + i)
  }
  // The meeting zone: a pale lilac rug, an easel, the coordinator's desk, a table and chairs.
  const { mz, lz, zy } = L
  carpetLilac(mz.x, zy, mz.w, ZH)
  easel(mz.x + 8, zy + 6)
  const ld = leadDesk(L), ls = leadSeat(L)
  chairDesk(ls.x, ls.y)
  bookshelf(mz.x + mz.w - 28, zy + 4, 'lead')
  meetingTable(mz.x + 20, zy + 66, 96)
  for (const cx of [30, 56, 82]) chairSmall(mz.x + cx, zy + 58)
  plantPot(mz.x + 4, zy + ZH - 24, 0)
  // The lounge: lavender carpet, a recreation corner, a peach sofa facing a round coffee table.
  carpetStripes(lz.x, zy, lz.w, ZH)
  bamboo(lz.x + 6, zy + 4)
  pingPong(lz.x + 40, zy + 8)
  armchair(lz.x + 94, zy + 8)
  tvStand(lz.x + 6, zy + 40)
  armchair(lz.x + 94, zy + 42)
  shadow(lz.x + 42, zy + 84, 26, 5); disc(lz.x + 55, zy + 80, 12, '#c9a066'); disc(lz.x + 55, zy + 79, 11, '#e8c28a'); disc(lz.x + 55, zy + 78, 3, '#6a6f86')
  sofaPeach(lz.x + 18, zy + 98, 74)
  plantPot(lz.x + 100, zy + 100, 2); plantPot(lz.x + 4, zy + 100, 1)
}

// Who is where, in art pixels, kept between frames so walks are smooth.
const walkers = {}
const seen = {}
const known = {}
let first = true
const idle = w => w.mode === 'sit' && !w.path.length

let last = performance.now()
function frame(now) {
  const dt = Math.min(0.5, (now - last) / 1000)
  last = now
  requestAnimationFrame(frame)
  if (!state) return
  for (const el of stage.querySelectorAll('.tag, .bubble')) el.remove()

  // An agent that left the team keeps its desk until it is back at it with nothing left to say.
  for (const a of state.agents) known[a.id] = a
  const live = new Set(state.agents.map(a => a.id))
  for (const id of Object.keys(known)) {
    const w = walkers[id]
    if (!live.has(id) && (!w || (w.mode === 'sit' && !w.path.length && !w.queue.length))) delete known[id]
  }
  const agents = Object.values(known)
  const L = layout(agents.length)
  if (canvas.width !== L.W || canvas.height !== L.H) { canvas.width = L.W; canvas.height = L.H }
  // Fit the whole floor in the window, wide or tall.
  canvas.style.width = `${Math.min(stage.clientWidth, ((innerHeight - 60) * L.W) / L.H)}px`
  const scale = canvas.clientWidth / L.W
  const tick = Math.floor(now / 250)

  // The static scene: repainted only when the layout, the names or the part of the day change.
  const phase = phaseOf()
  const key = `${L.W}x${L.H}|${phase}|${agents.map(a => a.name).join()}`
  if (key !== cache.key) {
    cache.key = key
    cache.c.width = L.W; cache.c.height = L.H
    ctx = cache.c.getContext('2d')
    paint(L, agents, phase)
    ctx = main
  }
  main.drawImage(cache.c, 0, 0)
  // Desks are drawn with the critters, so whoever stands in front covers them.
  const things = []
  agents.forEach((a, i) => {
    const d = deskOf(L, i)
    // Read at draw time: a walk that wakes the agent turns its screen back on in the same frame.
    things.push({ y: d.y + 13, draw: () => {
      const screen = a.alert ? 'alert' : walkers[a.id].asleep ? 'off' : a.working ? 'on' : a.status === 'completed' ? 'done' : 'off'
      desk(d, screen, tick, a.name)
    } })
  })
  const ld = leadDesk(L)
  things.push({ y: ld.y + 13, draw: () => desk(ld, state.lead.alert ? 'alert' : state.lead.busy ? 'on' : 'off', tick, 'lead') })

  // Agents: sit, or walk to whoever they report to and back the same way.
  agents.forEach((a, i) => {
    const w = walkers[a.id] ??= { ...seatOf(L, i), path: [], queue: [], mode: 'sit', facing: 'down', talk: 0, text: '' }
    // Desks move when the team grows or shrinks: whoever sits follows its desk.
    if (idle(w)) Object.assign(w, seatOf(L, i))
    if (a.report && seen[a.id] !== a.report.at) {
      seen[a.id] = a.report.at
      if (!first) w.queue.push(a.report)
    }
    // A visit goes to the person, not the desk: wait until they sit at it, and stay put while someone visits.
    const visited = id => Object.values(walkers).some(v => v.to === id && v.mode !== 'sit')
    if (w.queue.length && idle(w) && !visited(a.id)) {
      const report = w.queue[0]
      const target = agents.findIndex(b => b.name === report.to || b.id === report.to)
      const peer = target >= 0 && target !== i ? agents[target] : undefined
      if (!peer || (walkers[peer.id] && idle(walkers[peer.id]))) {
        w.queue.shift()
        w.text = report.text
        w.to = peer?.id
        w.route = peer ? routeToDesk(L, i, target) : routeToLead(L, i)
        w.path = w.route.slice(1)
        w.back = true
      }
    }
    if (w.path.length) {
      const p = w.path[0]
      const dx = p.x - w.x, dy = p.y - w.y, d = Math.hypot(dx, dy), step = 90 * dt
      w.facing = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'
      if (d <= step) { w.x = p.x; w.y = p.y; w.path.shift() } else { w.x += (dx / d) * step; w.y += (dy / d) * step }
      w.mode = 'walk'
      if (!w.path.length) {
        if (w.back) { w.mode = 'talk'; w.talk = 6; w.facing = 'right' }
        else { w.mode = 'sit'; w.facing = 'down'; w.to = undefined }
      }
    } else if (w.mode === 'talk') {
      w.talk -= dt
      if (w.talk <= 0) { w.back = false; w.path = w.route.slice(0, -1).reverse() }
    }
    // Asleep unless a report is queued or it is walking or talking. Waking shows a "!" for 1.5s.
    const awake = !a.sleeping || w.queue.length > 0 || w.mode !== 'sit' || w.path.length > 0
    if (w.asleep && awake) w.wakeAt = now + 1500
    w.asleep = !awake
  })
  first = false

  const seatL = leadSeat(L)
  const critters = [
    ...agents.map(a => ({ ...walkers[a.id], color: shadeOf(a.name), a })),
    { ...seatL, mode: 'sit', facing: 'down', color: '#d97757', lead: true },
  ]
  for (const p of critters) things.push({ y: p.y, draw: () => {
    const typing = p.lead ? state.lead.busy : p.a.working && !p.a.alert && !p.asleep
    shadow(p.x + 3, p.y - 1, CW - 6, 3)
    critter(p.x, p.y, p.color, p.mode, tick, p.facing, p.lead, !!p.asleep, !!typing && p.mode === 'sit', p.lead ? 0 : hash(p.a.name) % 14)
    const alert = p.lead ? state.lead.alert : p.a.alert
    if (alert && tick % 2) { px(p.x + CW / 2 - 1, p.y - CH - 14, 3, 7, '#ff5a5a'); px(p.x + CW / 2 - 1, p.y - CH - 5, 3, 3, '#ff5a5a') }
    // Two "z" letters rise from the head while it sleeps, one behind the other.
    if (p.asleep) for (const k of [0, 4]) {
      const zy = p.y - CH - 6 - ((tick + k) % 8) * 3
      const zx = p.x + CW - 2 + ((tick + k) % 8) * 2
      for (const [row, cols] of [[0, [0, 1, 2]], [1, [2]], [2, [1]], [3, [0, 1, 2]]]) for (const col of cols) px(zx + col * 2, zy + row * 2, 2, 2, '#6a6fd0')
    }
    // The "!" after a wake, for 1.5s.
    if (p.wakeAt > now) { px(p.x + CW / 2 - 1, p.y - CH - 14, 3, 7, '#ffb000'); px(p.x + CW / 2 - 1, p.y - CH - 5, 3, 3, '#ffb000') }
  } })
  things.sort((p, q) => p.y - q.y).forEach(t => t.draw())

  // Name pills over the heads: a status dot, the name, and the task or what it does right now. A bubble rides above.
  const pill = (name, dot, sub, alertSub) => `<span class="pill"><i class="dot" style="background:${dot}"></i>${esc(name)}</span>${sub ? `<span class="sub${alertSub ? ' alert' : ''}">${esc(sub)}</span>` : ''}`
  for (const p of critters) {
    const up = (p.lead ? state.lead.alert : p.a.alert) || p.wakeAt > now ? 14 : 0
    let html
    if (p.lead) html = pill('coordinator', state.lead.alert ? '#ff5a5a' : state.lead.busy ? '#3ddc84' : '#9a9aaa', state.lead.doing || (state.lead.busy ? 'working' : 'idle'))
    else {
      const a = p.a
      html = a.alert ? pill(a.name, '#ff5a5a', `! ${a.alert.text}`, true)
        : p.asleep && live.has(a.id) ? pill(a.name, '#9a9aaa', 'sleeping')
        : pill(a.name, a.working ? '#3ddc84' : '#7ab8ff', a.working ? `▸ ${a.doing}` : live.has(a.id) ? (a.task ?? a.status) : 'left the team')
    }
    tag(p.x + CW / 2, p.y - CH - 4 - up, html, scale)
    if (p.mode === 'talk') bubble(p.x + CW / 2, p.y - CH - 4 - up, p.text, scale, 48)
  }
  const listening = critters.some(p => p.mode === 'talk' && !p.to)
  if (state.lead.busy && state.lead.said && !listening) bubble(seatL.x + CW / 2, seatL.y - CH - 4, state.lead.said, scale, 48)

  const working = agents.filter(a => a.working && !a.sleeping).length
  document.getElementById('info').textContent =
    `${agents.length} agents, ${working} working · tasks ${state.tasks.done}/${state.tasks.total} done`
}

// The task queue, pinned beside the floor: what waits, who took what, what is done.
const COLUMNS = [['pending', 'To do'], ['in_progress', 'Taken'], ['completed', 'Done']]
function queue() {
  const cards = state.board ?? []
  const chip = who => who === 'lead'
    ? `<span class="who" style="background:var(--lead)">coordinator</span>`
    : `<span class="who" style="background:${shadeOf(who)}">${esc(who)}</span>`
  document.getElementById('queue').innerHTML = `<h2>Task queue ${state.tasks.done}/${state.tasks.total}</h2>` + (cards.length ? COLUMNS.map(([status, title]) => {
    const here = cards.filter(c => c.status === status)
    return `<h3>${title} (${here.length})</h3>` + here.map(c => `<div class="card ${status === 'completed' ? 'done' : ''}">#${esc(c.id)} ${esc(c.subject)}<br>${
      c.owner ? chip(c.owner) : c.blocked ? '<span class="blocked">blocked</span>' : '<span class="free">nobody yet</span>'}</div>`).join('')
  }).join('') : '<div style="color:var(--dim)">No tasks yet.</div>')
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
function tag(x, y, html, scale) {
  const el = document.createElement('div')
  el.className = 'tag'
  el.style.left = `${canvas.offsetLeft + x * scale}px`
  el.style.top = `${y * scale}px`
  el.innerHTML = html
  stage.appendChild(el)
}
// lift: CSS pixels to rise above the anchor, so a bubble clears the name pill under it.
function bubble(x, y, text, scale, lift = 0) {
  const el = document.createElement('div')
  el.className = 'bubble'
  el.style.left = `${canvas.offsetLeft + x * scale}px`
  el.style.top = `${y * scale - lift}px`
  el.textContent = text.length > 140 ? `${text.slice(0, 139)}…` : text
  stage.appendChild(el)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
